name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # VERSION is derived from `git describe --tags`
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
      - name: Package
        run: |
          cd bin
          asset="skm-${{ matrix.goos }}-${{ matrix.goarch }}"
          archive="skm-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar czf "../${archive}" "${asset}"
      - uses: actions/upload-artifact@v4
        with:
          name: skm-${{ matrix.goos }}-${{ matrix.goarch }}
          path: '*.tar.gz'

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz > checksums.txt
      # The release description is this version's CHANGELOG.md section (written
      # by `make bump-*` via git-cliff, committed on the tagged commit), not
      # only GitHub's generated commit list. A tag with no matching section
      # leaves the body empty, which the generated notes below still fill.
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-notes.md
          generate_release_notes: true
          files: dist/*
