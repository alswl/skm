name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # pkg/managers/deploy_test.go exercises `git commit` against a real repo
      # fixture; a fresh runner has no git identity configured, which makes
      # git fail with exit 128 ("unable to auto-detect email address").
      - run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: make build
      - run: make test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v7
        with:
          # v6 of this action doesn't support golangci-lint v2 at all; v7 is
          # required. .golangci.yml uses the v2 config schema and go.mod
          # targets go 1.26 — pin the v2 release that matches local dev
          # (`golangci-lint version`).
          version: v2.12.2
