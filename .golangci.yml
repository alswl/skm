version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Println
        - fmt.Print
    # Architecture check: this deliberately small application has one business
    # layer, pkg/services. Commands and the TUI may call it directly; only that
    # layer may reach persistence and the plugin protocol.
    depguard:
      rules:
        presentation-boundary:
          files:
            - "**/cmd/skm/**"
            - "**/pkg/commands/**"
            - "**/pkg/tui/**"
            - "!$test"
          deny:
            - pkg: github.com/alswl/skm/skm/pkg/dal
              desc: "presentation must reach data access through pkg/services, not pkg/dal directly"
            - pkg: github.com/alswl/skm/skm/pkg/plugins
              desc: "presentation must not reach the plugin protocol layer directly; it is consumed by pkg/services"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
